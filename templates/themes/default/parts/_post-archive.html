<a class="flex items-center gap-4 rounded-2xl border border-slate-200 bg-white px-4 py-3 shadow-sm hover:border-slate-900" href="/$url$">
    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-900 text-sm font-semibold text-white">$day$</span>
    <span class="flex-1">
        <span class="block text-lg font-semibold text-slate-900">$title$</span>
        $if(tags)$
            <span class="text-sm text-slate-500">$tags$</span>
        $endif$
    </span>
</a>
