<div class="mt-6 flex flex-col gap-3 border-t border-slate-200 pt-4 text-sm text-slate-600">
    <div class="flex w-full flex-wrap items-center gap-2">
        <div class="flex flex-wrap items-center gap-2">
            $if(tags)$
                <span class="text-slate-400">Tags:</span> $tags$
            $endif$
        </div>
        <div class="ml-auto flex items-center gap-2 text-right">
            <span data-post-date="$post-date$">$date$</span>
        </div>
    </div>

    <div class="flex w-full flex-wrap items-center gap-2">
        $if(commentsCount)$
        <div class="ml-auto">
            <span class='post-comments'><a class="text-amber-600 hover:text-amber-700" itemprop='discussionUrl' href='/$url$#disqus_thread' data-disqus-identifier="$disqus$">Comments ...</a></span>
        </div>
        $else$
        <div class="ml-auto flex items-center gap-3">
            <div class="fb-like" data-href="$site.url$/$url$" data-layout="button_count" data-action="like"
                 data-show-faces="true" data-share="false"></div>
            <div class="g-plusone" data-size="medium" data-href="$site.url$/$url$"></div>
        </div>
        $endif$
    </div>
</div>

$if(commentsCount)$
$else$
<div id="fb-root"></div>
<script type="text/javascript">

(() => {
    const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if (isLocal) {
        document.querySelectorAll(".fb-like").forEach((el) => el.remove());
        return;
    }

    window.fbAsyncInit = function() {
        FB.init({
            appId: '261906013973423',
            xfbml: true,
            version: 'v19.0'
        });
    };
    (function(d){
        var js, id = 'facebook-jssdk'; if (d.getElementById(id)) {return;}
        js = d.createElement('script'); js.id = id; js.async = true;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        d.getElementsByTagName('head')[0].appendChild(js);
    }(document));
})();

window.___gcfg = {lang: 'en', parsetags: 'onload'};
(function() {
    var po = document.createElement('script'); po.type = 'text/javascript'; po.async = true;
    po.src = 'https://apis.google.com/js/plusone.js';
    var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(po, s);
})();
</script>
$endif$
