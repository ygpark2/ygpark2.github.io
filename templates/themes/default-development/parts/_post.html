<article class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="space-y-4">
        <h1 class="text-3xl font-semibold text-slate-900">$title$</h1>
        <div class="post-body space-y-4 text-slate-700 prose prose-slate max-w-none">
            $body$
        </div>
    </div>

    $partial("templates/themes/default/parts/_post-footer.html")$

    $if(collection)$
        <div class="mt-6">
            $collection$
        </div>
    $endif$

    <div id="disqus_thread" class="mt-6 border-t border-slate-200 pt-6 text-slate-700">
        $comments$
    </div>

    $partial("templates/themes/default/parts/_disqus-post.html")$
</article>
