<article class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="space-y-4">
        <h2 class="text-2xl font-semibold text-slate-900">
            <a class="hover:text-amber-600" href="/$url$">$title$</a>
        </h2>

        <div class="space-y-4 text-slate-700 prose prose-slate max-w-none">
        $if(teaser)$
            $teaser$

            $if(readmore)$
                <p><a class="font-semibold text-amber-600 hover:text-amber-700" href="/$url$">$readmore$</a></p>
            $else$
                <p><a class="font-semibold text-amber-600 hover:text-amber-700" href="/$url$">Read more ...</a></p>
            $endif$
        $else$
            $body$
        $endif$
        </div>
    </div>
    $partial("templates/themes/default/parts/_post-footer.html")$
</article>
