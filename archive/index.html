<script>
  (function() {
    const container = document.getElementById("archive-months");
    if (!container) return;
    const links = Array.from(container.querySelectorAll("a"));

    function setActive(hash) {
      links.forEach((link) => {
        const isActive = link.getAttribute("href") === hash;
        link.classList.toggle("bg-slate-900", isActive);
        link.classList.toggle("text-white", isActive);
        link.classList.toggle("shadow-sm", isActive);
        link.setAttribute("aria-current", isActive ? "true" : "false");
      });
    }

    setActive(location.hash);
    window.addEventListener("hashchange", () => setActive(location.hash));
    links.forEach((link) => link.addEventListener("click", () => setActive(link.getAttribute("href"))));
  })();
</script>
